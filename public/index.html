<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chips — Four in a row</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="wordmark" href="/">Chips<span>Private games. Public losses.</span></a><div class="wallet"><span>Your Tokens<strong id="playerBalance">—</strong></span><span>His Tokens<strong id="houseBalance">—</strong></span></div><button id="sound" class="quiet" aria-pressed="false">Sound off</button></header>
<main><section class="table-area" aria-label="Four in a row"><div class="table-heading"><div><p class="small">A game with Chips</p><h1>Four in a row.</h1></div><span id="stakeLabel"></span></div><div class="cabinet"><div class="crest">♛</div><div class="drops" id="drops" aria-label="Choose a column"></div><div id="board" role="img" aria-label="Empty game board"></div><div class="cabinet-foot"><span><i class="key player"></i>You</span><span id="status" role="status" aria-live="polite">Choose your stake.</span><span>Chips<i class="key house"></i></span></div></div><p class="hint">Pick a column. Connect four horizontally, vertically, or diagonally.</p></section>
<aside><div class="portrait"><img src="/assets/chips.png" alt="Chips, the proprietor, wearing his self-appointed crown"></div><div class="dialogue"><span class="name">Chips</span><p id="remark">Make yourself comfortable. Within reason.</p><small id="timing"></small></div><section class="round-controls"><label for="stake">Tokens on the table</label><select id="stake"><option value="0">Just playing · 0</option><option value="1">1 Token</option><option value="5">5 Tokens</option><option value="10" selected>10 Tokens</option><option value="25">25 Tokens</option><option value="50">50 Tokens</option><option value="100">100 Tokens</option></select><button id="newRound" class="primary">Take a seat</button><button id="retry" class="primary" hidden>Retry Chips’ turn</button><p id="error" role="alert"></p><button id="refill" class="quiet">Get 1,000 free Tokens each</button></section><details><summary>Table history</summary><ol id="history"></ol></details><footer>All Tokens are free. Nothing to buy.</footer></aside></main><script type="module" src="/app.js"></script></body></html>
